# █▀▄ █▀▀ █▀▀ █▀█ █▀█ ▄▀█ ▀█▀ █ █▀█ █▄░█
# █▄▀ ██▄ █▄▄ █▄█ █▀▄ █▀█ ░█░ █ █▄█ █░▀█

decoration {
  # █▀█ █▀█ █░█ █▄░█ █▀▄   █▀▀ █▀█ █▀█ █▄░█ █▀▀ █▀█
  # █▀▄ █▄█ █▄█ █░▀█ █▄▀   █▄▄ █▄█ █▀▄ █░▀█ ██▄ █▀▄
  rounding = 6

  # █▄▄ █░░ █░█ █▀█
  # █▄█ █▄▄ █▄█ █▀▄
  blur {
    # enabled = true
    # xray = true
    # special = false
    # new_optimizations = true
    # size = 14
    # passes = 3
    # brightness = 1
    # noise = 0.01
    # contrast = 1
    # popups = true
    # popups_ignorealpha = 0.6
    # input_methods = true
    # input_methods_ignorealpha = 0.8

    enabled = true
    size = 6
    passes = 3
    new_optimizations = true
    ignore_opacity = true
    xray = false
  }


  # █▀ █░█ ▄▀█ █▀▄ █▀█ █░█░█
  # ▄█ █▀█ █▀█ █▄▀ █▄█ ▀▄▀▄▀

  shadow {
    enabled = false
    ignore_window = true
    range = 30
    offset = 0 2
    render_power = 4
    color = $secondary
  }

  # Dim
  dim_inactive = true
  dim_strength = 0.025
  dim_special = 0.07
}

# █▀▀ █▀▀ █▄░█ █▀▀ █▀█ ▄▀█ █░░
# █▄█ ██▄ █░▀█ ██▄ █▀▄ █▀█ █▄▄
general {
  gaps_in = 2
  gaps_out = 4
  gaps_workspaces = 50

  border_size = 1
  col.active_border = $primary_container
  col.inactive_border = $secondary_container
  resize_on_border = true

  no_focus_fallback = true

  allow_tearing = true # This just allows the `immediate` window rule to work

  snap {
    enabled = true
  }
}

group {
  col.border_active = $primary $on_primary_container 45deg
  col.border_inactive = $on_secondary $secondary_container 45deg
  col.border_locked_active = $primary $on_primary_container 45deg
  col.border_locked_inactive = $on_secondary $secondary_container 45deg
  groupbar {
    gradients = false
    col.active = $primary
    col.inactive = $tertiary_container
  }
}
